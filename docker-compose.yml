version: '3.8'
services:
  #PHP Service
  wedding_app:
    build:
      args:
        user: wedding_app-api-user
        uid: 100033:100033
      context: .
      dockerfile: Dockerfile
    container_name: wedding_app_container
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: wedding
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - node_modules:/var/www/node_modules
    networks:
      - wedding_app_network

    #Nginx Service
  wedding_webserver:
    image: nginx:1.29-alpine
    container_name: wedding_webserver_container
    restart: unless-stopped
    tty: true
    ports:
      - "5457:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wedding_app_network
  #mysql service
  wedding_mysql:
    platform: linux/amd64
    image: mysql:8.0-debian
    container_name: wedding_app_mysql_container
    restart: unless-stopped
    ports:
      - "3338:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wedding
      MYSQL_USER: wedding
      MYSQL_PASSWORD: password
    volumes:
      - wedding_mysql_data:/var/lib/mysql
    networks:
      - wedding_app_network
  wedding_phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: wedding_phpmyadmin_container
    restart: unless-stopped
    ports:
      - "8384:80"
    environment:
      PMA_HOST: wedding_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      - wedding_mysql
    networks:
      - wedding_app_network
volumes:
  wedding_mysql_data:
    driver: local
  node_modules:
    driver: local
#  Docker Networks
networks:
  wedding_app_network:
    driver: bridge
